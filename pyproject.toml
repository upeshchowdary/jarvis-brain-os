[project]
name = "jarvis-brain"
version = "0.1.0"
description = "JARVIS AI Operating System - Phase 1: The Brain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "sqlite-utils>=3.36",
    "aiosqlite>=0.20.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "psutil>=5.9.0",
    "mss>=9.0.1",
    "chromadb>=0.5.0",
    "playwright>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-m 'not network'"
markers = [
    "network: needs live internet access (run with -m network)",
]

[tool.pyright]
include = ["."]
exclude = [".venv", "data", "**/__pycache__"]
reportMissingImports = false
reportMissingModuleSource = false
typeCheckingMode = "off"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
# Correctness defaults + bugbear strip check + bans on shell=True / os.system.
select = ["E4", "E7", "E9", "F", "B005", "B006", "S602", "S604", "S605"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
