# Replay eval set for the intent step (brain/intent.py).
#
# The first block is the user's real messages from the 2026-10-30 chats (verbatim), with the context they
# were said in. The second block is unseen paraphrases of the same behaviours, so the score does not just
# measure how closely a message matches a few-shot example in the prompt.
#
# Case format:
#   id:       unique name
#   turns:    recent conversation, oldest first: {user, assistant, channel (default text)}
#             assistant turns end with "[did: …]" action notes like the real history does
#   task:     current task: a goal string, or {goal, status, channel, plan: [{subgoal, status}],
#             steps: [{tool, args, result, ok}]}; omit for no task
#   message:  the new message
#   expect:   checks (only the ones given are scored):
#     kind:                action | question | chat (always given)
#     continues_task:      true / false
#     single_step:         true / false
#     request_contains:    substrings that must all be in the rewritten request (case-insensitive);
#                          an item that is a list means "any one of these"
#     tool_groups_include: groups that must all be in tool_groups; a list item means "any one of these"

# ── Real messages (2026-10-30) ──────────────────────────────────────────

- id: next-do-whatsapp
  source: real
  turns:
    - {channel: voice, user: "open whatsapp and msg nithesh say ee em chesadu", assistant: "Opened WhatsApp. [did: open_app(whatsapp) ✓]"}
  task:
    goal: "Send 'ee em chesadu' to Nithesh on WhatsApp desktop"
    channel: voice
    plan: [{subgoal: "Open WhatsApp", status: done}, {subgoal: "Send 'ee em chesadu' to Nithesh", status: todo}]
    steps: [{tool: open_app, args: "name=whatsapp", result: "Opened WhatsApp", ok: true}]
  message: "next do"
  expect: {kind: action, continues_task: true, single_step: false, request_contains: ["Nithesh", "ee em chesadu"], tool_groups_include: [messaging]}

