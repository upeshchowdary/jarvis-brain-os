name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pyright (basic) on the core packages
        run: pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (Linux — Windows modules are mocked by tests/conftest.py)
        if: runner.os == 'Linux'
        run: pip install -e ".[dev]"
      - name: Install (Windows — full desktop extras)
        if: runner.os == 'Windows'
        run: pip install -e ".[dev,windows]"
      - name: Tests (never perform real GUI/OS actions)
        run: python -m pytest -q --cov=core --cov=brain --cov=automation --cov=tools --cov=services --cov-report=term-missing:skip-covered
